name: Verify Free Diagram Editor
on:
  pull_request:
    paths:
      - "diagram/**"
      - "assets/diagram.js"
      - "assets/diagram-table.js"
      - "tests/table-import.cjs"
      - "assets/diagram.css"
      - "tests/smoke.py"
      - "build.py"
      - ".github/workflows/diagram-free-check.yml"
  push:
    branches: [main]
    paths:
      - "diagram/**"
      - "assets/diagram.js"
      - "assets/diagram-table.js"
      - "tests/table-import.cjs"
      - "assets/diagram.css"
      - "tests/smoke.py"
      - "build.py"
      - ".github/workflows/diagram-free-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: node --check assets/diagram.js
      - name: Check table parsing and layout
        run: |
          node --check assets/diagram-table.js
          node tests/table-import.cjs
      - name: Install browser tests
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify free PNG export, local palette and legacy data
        run: python tests/smoke.py
